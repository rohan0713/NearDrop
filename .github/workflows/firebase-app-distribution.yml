name: Deploy Feature to Firebase App Distribution

on:
  push:
    branches:
      - 'feature/**'
      - 'feature_*'
  workflow_dispatch:

concurrency:
  group: firebase-feature-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build & Distribute Feature Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK Platform 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37.0"
          cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/37\.0/37/g' "$ANDROID_HOME/platforms/android-37/source.properties"
          sed -i 's/37\.0/37/g' "$ANDROID_HOME/platforms/android-37/package.xml"

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release
          path: androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || '1:107890352208:android:4329ca640f57eb44a6f155' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'bluetooth-testers' }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: androidApp/build/outputs/apk/release/androidApp-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Message: ${{ github.event.head_commit.message }}
